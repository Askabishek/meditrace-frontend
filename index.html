<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MediTrace AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #080C18;
      --surface:   #111627;
      --surface2:  #1A2035;
      --blue:      #1A73E8;
      --blue-dim:  #1558B0;
      --blue-glow: rgba(26, 115, 232, 0.18);
      --text:      #E8EDF5;
      --muted:     #6B7A99;
      --border:    rgba(255,255,255,0.07);
      --radius:    18px;
      --font-ui:   'Inter', system-ui, sans-serif;
      --font-head: 'Space Grotesk', system-ui, sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Layout ── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 780px;
      margin: 0 auto;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 20px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo-mark {
      width: 36px;
      height: 36px;
      background: var(--blue);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo-mark svg { width: 20px; height: 20px; }

    .header-text h1 {
      font-family: var(--font-head);
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
      line-height: 1;
    }

    .header-text p {
      font-size: 11px;
      color: var(--muted);
      margin-top: 3px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: #34D399;
      border-radius: 50%;
      margin-left: auto;
      box-shadow: 0 0 0 2px rgba(52,211,153,0.25);
    }

    /* ── Messages area ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ── Welcome state ── */
    #welcome {
      margin: auto;
      text-align: center;
      padding: 20px;
    }

    #welcome .big-icon {
      width: 64px;
      height: 64px;
      background: var(--blue-glow);
      border: 1px solid rgba(26,115,232,0.3);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }

    #welcome .big-icon svg { width: 32px; height: 32px; }

    #welcome h2 {
      font-family: var(--font-head);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    #welcome p {
      font-size: 13.5px;
      color: var(--muted);
      line-height: 1.6;
      max-width: 320px;
      margin: 0 auto 24px;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .suggestion-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 12.5px;
      padding: 8px 14px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .suggestion-btn:hover {
      background: var(--surface2);
      border-color: rgba(26,115,232,0.4);
    }

    /* ── Bubble ── */
    .bubble-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .bubble-row.user { flex-direction: row-reverse; }

    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
    }

    .avatar.ai {
      background: var(--blue);
    }

    .avatar.ai svg { width: 15px; height: 15px; }

    .avatar.user-av {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      font-family: var(--font-head);
    }

    .bubble {
      max-width: 72%;
      padding: 11px 15px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.6;
      word-break: break-word;
    }

    .bubble.user {
      background: var(--blue);
      color: #fff;
      border-bottom-right-radius: 5px;
    }

    .bubble.ai {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-bottom-left-radius: 5px;
    }

    /* ── Typing indicator ── */
    #typing {
      display: none;
      align-items: flex-end;
      gap: 8px;
    }

    #typing.show { display: flex; }

    .typing-dots {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      border-bottom-left-radius: 5px;
      padding: 12px 16px;
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .typing-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      animation: bounce 1.2s infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    /* ── Input bar ── */
    #input-area {
      padding: 14px 16px;
      padding-bottom: max(14px, env(safe-area-inset-bottom));
      background: var(--bg);
      border-top: 1px solid var(--border);
    }

    #input-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 26px;
      padding: 8px 8px 8px 16px;
      transition: border-color 0.15s;
    }

    #input-row:focus-within {
      border-color: rgba(26,115,232,0.5);
    }

    #msg-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 14px;
      resize: none;
      max-height: 120px;
      line-height: 1.5;
    }

    #msg-input::placeholder { color: var(--muted); }

    #send-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--blue);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }

    #send-btn:hover { background: var(--blue-dim); }
    #send-btn:active { transform: scale(0.93); }
    #send-btn:disabled { background: var(--surface2); cursor: not-allowed; }

    #send-btn svg { width: 16px; height: 16px; }

    /* ── Error toast ── */
    #toast {
      display: none;
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: #2D1B1B;
      border: 1px solid rgba(239,68,68,0.3);
      color: #FCA5A5;
      font-size: 13px;
      padding: 10px 18px;
      border-radius: 20px;
      z-index: 100;
    }

    @media (max-width: 480px) {
      .bubble { max-width: 85%; }
      header { padding: 14px 16px 12px; }
      #messages { padding: 18px 14px; }
    }
  </style>
</head>
<body>
<div id="app">

  <!-- Header -->
  <header>
    <div class="logo-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
      </svg>
    </div>
    <div class="header-text">
      <h1>MediTrace AI</h1>
      <p>Medical intelligence assistant</p>
    </div>
    <div class="status-dot" title="Online"></div>
  </header>

  <!-- Messages -->
  <div id="messages">
    <div id="welcome">
      <div class="big-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#1A73E8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
        </svg>
      </div>
      <h2>How can I help you today?</h2>
      <p>Ask me anything about symptoms, medications, or medical conditions.</p>
      <div class="suggestions">
        <button class="suggestion-btn" onclick="useSuggestion(this)">What are symptoms of diabetes?</button>
        <button class="suggestion-btn" onclick="useSuggestion(this)">Explain high blood pressure</button>
        <button class="suggestion-btn" onclick="useSuggestion(this)">Common cold vs flu differences</button>
        <button class="suggestion-btn" onclick="useSuggestion(this)">What is ibuprofen used for?</button>
      </div>
    </div>

    <!-- Typing indicator -->
    <div id="typing">
      <div class="avatar ai">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
        </svg>
      </div>
      <div class="typing-dots">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div id="input-area">
    <div id="input-row">
      <textarea
        id="msg-input"
        rows="1"
        placeholder="Ask MediTrace AI..."
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button id="send-btn" onclick="sendMessage()" title="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>

</div>

<div id="toast"></div>

<script>
  const API = 'https://meditrace-ai-kj94.onrender.com';
  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('msg-input');
  const sendBtn    = document.getElementById('send-btn');
  const typingEl   = document.getElementById('typing');
  const welcomeEl  = document.getElementById('welcome');
  const toastEl    = document.getElementById('toast');

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function useSuggestion(btn) {
    inputEl.value = btn.textContent;
    autoResize(inputEl);
    inputEl.focus();
    sendMessage();
  }

  function appendBubble(role, text) {
    if (welcomeEl) welcomeEl.remove();

    const row = document.createElement('div');
    row.className = `bubble-row ${role}`;

    const avatar = document.createElement('div');
    if (role === 'ai') {
      avatar.className = 'avatar ai';
      avatar.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>`;
    } else {
      avatar.className = 'avatar user-av';
      avatar.textContent = 'A';
    }

    const bubble = document.createElement('div');
    bubble.className = `bubble ${role}`;
    bubble.textContent = text;

    row.appendChild(avatar);
    row.appendChild(bubble);

    // Insert before typing indicator
    messagesEl.insertBefore(row, typingEl);
    scrollBottom();
  }

  function scrollBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.style.display = 'block';
    setTimeout(() => toastEl.style.display = 'none', 3500);
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    inputEl.value = '';
    inputEl.style.height = 'auto';
    sendBtn.disabled = true;

    appendBubble('user', text);

    // Show typing
    typingEl.classList.add('show');
    scrollBottom();

    try {
      const res = await fetch(`${API}/chat/`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, language: 'auto' }),
      });

      if (!res.ok) throw new Error(`Server error ${res.status}`);

      const data = await res.json();
      typingEl.classList.remove('show');
      appendBubble('ai', data.response || 'No response received.');

    } catch (err) {
      typingEl.classList.remove('show');
      showToast('Could not reach MediTrace AI. Please try again.');
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }
</script>
</body>
</html>
